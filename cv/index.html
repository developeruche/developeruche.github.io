  <style>
    /* Status line under the CTAs — mirrors .section-label's terminal voice. */
    .cv-status {
      margin-top: var(--space-md);
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      min-height: 1.4em;
    }
    .cv-status[data-state="done"] { color: var(--color-accent); }
    .cv-meta {
      margin-top: var(--space-sm);
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      text-transform: none;
    }
  </style>

<body data-page="cv">
  <div id="site-header"></div>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <span class="section-label">// CURRICULUM VITAE</span>
        <h1 class="hero-title">DOWNLOAD<br /><span class="text-gradient">MY CV</span></h1>
        <p class="subline">Nwele Uchenna David — systems engineer working in Rust, the Ethereum execution layer, and zkVMs. The download should start on its own; if your browser blocked it, use the button below.</p>

        <div class="hero-cta">
          <a class="btn-primary" id="cv-download"
             href="/assets/cv/nwele-uchenna-david-cv.pdf"
             download="Nwele-Uchenna-David-CV.pdf">Download PDF <span aria-hidden="true">↓</span></a>
          <a class="btn-secondary" href="/assets/cv/nwele-uchenna-david-cv.pdf"
             target="_blank" rel="noopener">View in browser <span aria-hidden="true">↗</span></a>
          <a class="btn-secondary" href="/">Back home <span aria-hidden="true">→</span></a>
        </div>

        <p class="cv-status" id="cv-status" role="status"></p>
        <p class="cv-meta">PDF · A4 · updated <span id="cv-updated">—</span></p>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module">
    import { mountLayout } from '/assets/js/layout.js';
    mountLayout();

    const PDF = '/assets/cv/nwele-uchenna-david-cv.pdf';
    const link = document.getElementById('cv-download');
    const status = document.getElementById('cv-status');

    // Kick the download off automatically. Same-origin + [download] means the
    // browser saves the file instead of navigating away, so the page stays put
    // and the buttons remain available as a fallback.
    function startDownload() {
      link.click();
      status.textContent = '// Download started — check your downloads folder.';
      status.dataset.state = 'done';
    }

    // Show when the PDF was last built, straight from the response header —
    // no separate metadata file to keep in sync.
    fetch(PDF, { method: 'HEAD', cache: 'no-store' })
      .then((res) => {
        if (!res.ok) throw new Error(String(res.status));
        const mod = res.headers.get('last-modified');
        if (mod) {
          document.getElementById('cv-updated').textContent =
            new Date(mod).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        }
        startDownload();
      })
      .catch(() => {
        status.textContent = '// Automatic download unavailable — use the Download PDF button.';
      });
  </script>
</body>
