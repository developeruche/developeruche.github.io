<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-labelledby="t d" font-family="'Share Tech Mono', ui-monospace, monospace" font-size="17" fill="#0B1A2E">
  <title id="t">The IsZero algebraic circuit</title>
  <desc id="d">in times minus one (gate 0), times inv (gate 1), plus one (gate 2) gives out. in times out (gate 3) must equal zero.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1B3A6B"/></marker>
    <style>.w{fill:none;stroke:#1B3A6B;stroke-width:1.6;marker-end:url(#a)}.b{fill:#FCFBF8;stroke:#0B1A2E;stroke-width:1.6}.g{fill:#E7EAF0;stroke:#1B3A6B;stroke-width:1.6}.l{font-size:14px;fill:#54627A}</style>
  </defs>
  <rect width="640" height="560" fill="#F4F2EC"/>
  <!-- wires -->
  <path class="w" d="M85 480V400Q85 375 110 358"/><!-- in to g0 -->
  <path class="w" d="M190 480V400Q190 372 156 362"/><!-- -1 to g0 -->
  <path class="w" d="M150 318Q175 272 212 262"/><!-- g0 to g1 -->
  <path class="w" d="M320 400V320Q320 280 260 262"/><!-- inv to g1 -->
  <path class="w" d="M258 222Q290 190 322 172"/><!-- g1 to g2 -->
  <path class="w" d="M430 310V240Q430 190 372 172"/><!-- 1 to g2 -->
  <path class="w" d="M347 126V66"/><!-- g2 to out -->
  <path class="w" d="M382 45H500Q525 45 549 69"/><!-- out to g3 -->
  <path class="w" d="M50 480V40Q50 16 80 16H540Q570 16 570 40V60"/><!-- in to g3 -->
  <path class="w" d="M570 112V190"/><!-- g3 to zero -->
  <!-- nodes -->
  <rect class="b" x="30" y="480" width="80" height="50" rx="6"/><text x="70" y="511" text-anchor="middle">in</text>
  <rect class="b" x="150" y="480" width="80" height="50" rx="6"/><text x="190" y="511" text-anchor="middle">-1</text>
  <rect class="b" x="280" y="400" width="80" height="50" rx="6"/><text x="320" y="431" text-anchor="middle">inv</text>
  <rect class="b" x="390" y="310" width="80" height="50" rx="6"/><text x="430" y="341" text-anchor="middle">1</text>
  <circle class="g" cx="130" cy="340" r="26"/><text x="130" y="346" text-anchor="middle">×</text><text class="l" x="164" y="345">gate 0</text>
  <circle class="g" cx="235" cy="245" r="26"/><text x="235" y="251" text-anchor="middle">×</text><text class="l" x="150" y="228">gate 1</text>
  <circle class="g" cx="347" cy="152" r="26"/><text x="347" y="158" text-anchor="middle">+</text><text class="l" x="262" y="135">gate 2</text>
  <rect class="b" x="312" y="24" width="70" height="42" rx="6"/><text x="347" y="51" text-anchor="middle">out</text>
  <circle class="g" cx="570" cy="86" r="26"/><text x="570" y="92" text-anchor="middle">×</text><text class="l" x="476" y="118">gate 3</text>
  <rect class="b" x="520" y="192" width="100" height="50" rx="6"/><text x="570" y="223" text-anchor="middle">must = 0</text>
</svg>
