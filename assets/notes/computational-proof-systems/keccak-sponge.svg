  </defs>
  <rect width="700" height="300" fill="#F4F2EC"/>
  <text x="20" y="128">r</text><text x="20" y="208">c</text>
  <text x="200" y="28" text-anchor="middle" class="l">absorbing</text><text x="560" y="28" text-anchor="middle" class="l">squeezing</text>
